[project]
name = "dotfiles"
version = "0.1.0"
description = "Tests and tooling for the dotfiles repo"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "shellcheck-py>=0.11.0.1",
    "shfmt-py>=4.2.0",
    "ty>=0.0.84",
]

[tool.uv]
package = false
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["bin/dotfiles"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
