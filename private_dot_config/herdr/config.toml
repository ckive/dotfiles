# herdr configuration
# Place this file at ~/.config/herdr/config.toml
# Full option reference: `herdr --default-config`

[keys]
# Mirrors kitty's split scheme (cmd+d / opt+cmd+d): base key = vertical split
# (left/right), base+alt = horizontal split (top/bottom). Defaults were
# prefix+v and prefix+minus; changed for cross-tool muscle memory.
# NOTE: prefix+shift+d was NOT used here — it's already the default close_workspace.
split_vertical = "prefix+d"
split_horizontal = "prefix+alt+d"
